
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capen House AR Reconstruction</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f1eb;
      color: #292929;
      text-align: center;
    }

    header {
      padding: 24px 16px 10px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      line-height: 1.5;
    }

   model-viewer {
  display: block;
  width: 100%;
  max-width: 900px;
  height: 32vh;
  min-height: 300px;
  margin: 0 auto 30px;
  background-color: #30343a;
}

  </style>
</head>

<body>

  <header>
    <h1>Capen House</h1>
    <p>Full-scale 3D timber frame reconstruction.  Rotate the model to explore the timber frame.
      On a compatible mobile device, select the AR button
      to place the house in your open area at full scale.</p>
  </header>


<div class="instructions">
    <h2>17th-Century Original House</h2>
      <model-viewer
    src="capen-house-17.glb"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    camera-orbit="0deg 75deg 140%"
    camera-target="auto auto auto"
    shadow-intensity="1"
    shadow-softness="0.5"
    exposure="1">
  </model-viewer>

  <div class="instructions">
    <h2>17th-Century Original House</h2>
  </div>

  <model-viewer
    src="capen-house.glb"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    camera-orbit="0deg 75deg 140%"
    camera-target="auto auto auto"
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <div class="instructions">
    <h2>With 18th-century Additions</h2>
  </div>

</body>
</html>
</body>
</html>
